<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>るりちゃんのゲームランド</title>
<style>
  :root{ --bg:#fff7df; --ink:#4b3b32; --card:#ffffff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit;border:0;touch-action:manipulation}
  #app{height:100%;height:100dvh;display:flex;flex-direction:column;position:relative}
  header{padding:max(12px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:#fff;box-shadow:0 2px 10px #00000012;z-index:100}
  .title{font-size:clamp(18px,4.5vw,28px);font-weight:900;cursor:pointer}
  .header-right{display:flex;align-items:center;gap:8px}
  .version-tag{font-size:11px;color:#a0938a;font-weight:700;user-select:none;}
  .bgm-btn{background:#eef7ff;border:2px solid #bce0fd;border-radius:999px;padding:4px 10px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 2px 4px #0001}
  .stars{background:#fff1a8;border-radius:999px;padding:6px 14px;font-size:18px;font-weight:900;box-shadow:inset 0 -2px #e9cf59}
  main{flex:1;min-height:0;position:relative;overflow:hidden}
  
  .screen{position:absolute;inset:0;display:none !important;overflow:auto;padding:18px max(16px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-bottom));background:var(--bg);z-index:1}
  .screen.active{display:flex !important;flex-direction:column}
  
  .home{align-items:center;justify-content:center;text-align:center;gap:14px}
  .hero{font-size:clamp(50px,14vw,80px);animation:bob 1.7s ease-in-out infinite;cursor:pointer}
  @keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
  h1{margin:0;font-size:clamp(24px,6vw,36px);cursor:pointer}
  .subtitle{font-size:16px;font-weight:700}
  .games{width:min(760px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .gameBtn{background:#fff;border-radius:22px;padding:14px 8px;min-height:110px;box-shadow:0 6px 0 #eadfca;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900}
  .gameBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #eadfca}
  .gameIcon{font-size:40px}.gameName{font-size:16px}.gameDesc{font-size:11px;color:#78675b}
  
  .back{position:relative;align-self:flex-start;margin-bottom:10px;background:#fff;border-radius:999px;padding:8px 16px;font-weight:900;z-index:20;box-shadow:0 3px 8px #0002}
  .gameTitle{text-align:center;font-size:clamp(22px,5vw,30px);font-weight:900;margin:0 0 8px}
  .prompt{text-align:center;font-size:clamp(20px,4.5vw,26px);font-weight:900;margin:0 0 12px}
  
  /* 難易度選択モーダル */
  .diff-select{display:flex;flex-direction:column;gap:12px;width:min(400px,100%);margin:auto}
  .diff-btn{padding:16px;border-radius:20px;font-size:20px;font-weight:900;background:#fff;box-shadow:0 5px 0 #eadfca;cursor:pointer;text-align:center}
  .diff-btn.easy{border:3px solid #65d47c;color:#2e7d32}
  .diff-btn.normal{border:3px solid #ff9d4d;color:#e65100}
  .diff-btn.hard{border:3px solid #ff5b7d;color:#c2185b}
  .diff-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #eadfca}

  .bigArea{flex:1;min-height:300px;position:relative;overflow:hidden;border-radius:28px;background:#dff6ff;box-shadow:inset 0 0 0 4px #fff}
  
  .feedback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(28px,8vw,60px);font-weight:900;z-index:50;opacity:0;white-space:nowrap;background:rgba(255,255,255,0.7);border-radius:28px;margin:auto;max-width:90%;max-height:100px;padding:10px 20px;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
  .feedback.show{animation:feedback .65s ease}
  @keyframes feedback{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1)}}
  
  .colorChoices,.choiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(650px,100%);margin:auto}
  .choiceGrid.grid6{grid-template-columns:repeat(3,1fr)}
  .colorChoice{min-height:100px;border-radius:24px;box-shadow:0 6px 0 #0002;border:3px solid #fff}
  .colorChoice:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
  .animalChoice{background:#fff;border-radius:24px;min-height:100px;box-shadow:0 6px 0 #eadfca;font-size:50px}
  .animalChoice:active{transform:translateY(4px);box-shadow:0 2px 0 #eadfca}
  
  .balloon{position:absolute;border-radius:50% 50% 46% 46%;width:76px;height:92px;box-shadow:inset -10px -12px 15px #0002, inset 8px 8px 10px #fff8;animation:floatUp linear forwards}
  .balloon:after{content:"";position:absolute;width:2px;height:45px;background:#777;left:50%;top:90px}
  @keyframes floatUp{from{transform:translateY(110vh)}to{transform:translateY(-180px)}}
  .pop{animation:pop .18s ease forwards!important}
  @keyframes pop{to{transform:scale(1.5);opacity:0}}
  
  .scorePill{position:absolute;right:12px;top:12px;background:#fff;padding:8px 14px;border-radius:999px;font-weight:900;z-index:10}
  .car{position:absolute;font-size:70px;left:-100px;bottom:22px;animation:drive 5s linear infinite}
  @keyframes drive{to{left:calc(100% + 100px)}}
  .road{position:absolute;left:0;right:0;bottom:0;height:100px;background:#777;border-top:8px solid #fff}
  .road:after{content:"";position:absolute;left:0;right:0;top:43px;border-top:8px dashed #ffe36e}
  .tapTarget{position:absolute;font-size:72px;user-select:none}
  .tapTarget:active{transform:scale(.85)}

  .bookCard{flex:1;background:#fff;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-shadow:0 6px 0 #eadfca;cursor:pointer;text-align:center;gap:16px}
  .bookIcon{font-size:clamp(80px,25vw,130px)}
  .bookText{font-size:clamp(20px,5vw,28px);font-weight:900}

  .drawArea{flex:1;background:#fff;border-radius:24px;position:relative;touch-action:none;box-shadow:inset 0 0 0 4px #eadfca}
  canvas{width:100%;height:100%;border-radius:24px;display:block}
  .drawTools{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .colorDot{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px #0002;cursor:pointer}
  .colorDot.active{transform:scale(1.2);border-color:#4b3b32}

  .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
  .confetti{position:absolute;width:12px;height:12px;top:-20px;animation:confettiFall 2.5s ease-out forwards}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

  @media(min-width:700px){.games{grid-template-columns:repeat(3,1fr)}.colorChoices,.choiceGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title" onclick="playWelcomeVoice()">🌈 るりちゃんのゲームランド</div>
  <div class="header-right">
    <button class="bgm-btn" id="bgmToggleBtn" onclick="toggleBGM()">🎵 ON</button>
    <div class="version-tag">v1.3</div>
    <div class="stars">⭐ <span id="stars">0</span></div>
  </div>
</header>
<main>
<section id="home" class="screen active home">
  <div class="hero" onclick="playWelcomeVoice()">🦁🎈</div>
  <h1 onclick="playWelcomeVoice()">たのしく あそぼう！</h1>
  <div class="subtitle">すきなゲームをタッチしてね 👆</div>
  <div class="games">
    <button class="gameBtn" onclick="selectDifficulty('color')"><div class="gameIcon">🌈</div><div class="gameName">いろタッチ</div><div class="gameDesc">おなじ いろ</div></button>
    <button class="gameBtn" onclick="selectDifficulty('animal')"><div class="gameIcon">🐶</div><div class="gameName">どうぶつ</div><div class="gameDesc">どうぶつ さがし</div></button>
    <button class="gameBtn" onclick="selectDifficulty('number')"><div class="gameIcon">🔢</div><div class="gameName">すうじ</div><div class="gameDesc">すうじ タッチ</div></button>
    <button class="gameBtn" onclick="selectDifficulty('shape')"><div class="gameIcon">🔷</div><div class="gameName">かたち</div><div class="gameDesc">かたち さがし</div></button>
    <button class="gameBtn" onclick="startBalloons()"><div class="gameIcon">🎈</div><div class="gameName">ふうせん</div><div class="gameDesc">タッチで パーン</div></button>
    <button class="gameBtn" onclick="startStars()"><div class="gameIcon">⭐</div><div class="gameName">ほしあつめ</div><div class="gameDesc">ほしを タッチ</div></button>
    <button class="gameBtn" onclick="startCars()"><div class="gameIcon">🚗</div><div class="gameName">くるま</div><div class="gameDesc">くるま タッチ</div></button>
    <button class="gameBtn" onclick="startBook()"><div class="gameIcon">📖</div><div class="gameName">えほん</div><div class="gameDesc">おはなし タッチ</div></button>
    <button class="gameBtn" onclick="startDraw()"><div class="gameIcon">🎨</div><div class="gameName">おえかき</div><div class="gameDesc">じゆうに かこう</div></button>
  </div>
</section>

<!-- 難易度選択画面 -->
<section id="difficulty" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">むずかしさを えらんでね！</div>
<div class="diff-select">
  <button class="diff-btn easy" onclick="startGameWithDiff('easy')">🌱 かんたん (4択)</button>
  <button class="diff-btn normal" onclick="startGameWithDiff('normal')">🌸 ふつう (6択)</button>
  <button class="diff-btn hard" onclick="startGameWithDiff('hard')">🔥 むずかしい (6択+難読)</button>
</div>
</section>

<section id="color" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">🌈 いろタッチ</div>
<div class="prompt" id="colorPrompt"></div>
<div class="colorChoices" id="colorChoices"></div>
<div class="feedback" id="colorFeedback"></div>
</section>

<section id="animal" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">🐶 どうぶつタッチ</div>
<div class="prompt" id="animalPrompt"></div>
<div class="choiceGrid" id="animalChoices"></div>
<div class="feedback" id="animalFeedback"></div>
</section>

<section id="numberGame" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">🔢 すうじタッチ</div>
<div class="prompt" id="numberPrompt"></div>
<div class="choiceGrid" id="numberChoices"></div>
<div class="feedback" id="numberFeedback"></div>
</section>

<section id="shapeGame" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">🔷 かたちタッチ</div>
<div class="prompt" id="shapePrompt"></div>
<div class="choiceGrid" id="shapeChoices"></div>
<div class="feedback" id="shapeFeedback"></div>
</section>

<section id="balloons" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">🎈 ふうせん パーン！</div>
<div class="prompt">ふうせんを タッチしてね！</div>
<div class="bigArea" id="balloonArea"><div class="scorePill">🎈 <span id="balloonScore">0</span></div></div>
</section>

<section id="starsGame" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">⭐ ほしあつめ</div>
<div class="prompt">ほしを みつけて タッチ！</div>
<div class="bigArea" id="starArea"></div>
</section>

<section id="cars" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">🚗 くるま タッチ</div>
<div class="prompt">くるまを タッチしてね！</div>
<div class="bigArea" id="carArea">
  <div class="road"></div>
  <div class="car" id="car">🚙</div>
</div>
</section>

<section id="book" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">📖 えほん</div>
<div class="prompt">画面をタッチして ページをめくってね！</div>
<div class="bookCard" onclick="nextBookPage()">
  <div class="bookIcon" id="bookIcon">🐱</div>
  <div class="bookText" id="bookText">こねこが います</div>
</div>
</section>

<section id="draw" class="screen">
<button class="back" onclick="goHome()">← もどる</button>
<div class="gameTitle">🎨 じゆうにおえかき</div>
<div class="drawArea" id="drawContainer">
  <canvas id="drawCanvas"></canvas>
</div>
<div class="drawTools">
  <div class="colorDot active" style="background:#ff5b5b;" onclick="setDrawColor('#ff5b5b', this)"></div>
  <div class="colorDot" style="background:#4aa8ff;" onclick="setDrawColor('#4aa8ff', this)"></div>
  <div class="colorDot" style="background:#ffd84a;" onclick="setDrawColor('#ffd84a', this)"></div>
  <div class="colorDot" style="background:#5dcc78;" onclick="setDrawColor('#5dcc78', this)"></div>
  <div class="colorDot" style="background:#4b3b32;" onclick="setDrawColor('#4b3b32', this)"></div>
  <button class="back" style="margin:0;padding:6px 14px;" onclick="clearCanvas()">🗑️ けす</button>
</div>
</section>

</main>
</div>

<div id="confettiContainer" class="confetti-container"></div>

<script>
const $=id=>document.getElementById(id);
let stars=Number(localStorage.getItem('ruriStars')||0);
$('stars').textContent=stars;
let timer=null;
let welcomeLoopTimer=null;
let currentVoiceAudio = null;
let currentTargetGame = '';
let currentDifficulty = 'easy';

let audioCtx = null;
let bgmGainNode = null;
let bgmAudio = new Audio('bgm.mp3');
bgmAudio.loop = true;

const BGM_VOLUME = 0.05;
let isBgmEnabled = true;

function initAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
      const source = audioCtx.createMediaElementSource(bgmAudio);
      bgmGainNode = audioCtx.createGain();
      bgmGainNode.gain.value = BGM_VOLUME;
      source.connect(bgmGainNode);
      bgmGainNode.connect(audioCtx.destination);
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function startBGM() {
  initAudioContext();
  if (isBgmEnabled) {
    bgmAudio.play().catch(() => {});
  }
}

function toggleBGM() {
  initAudioContext();
  isBgmEnabled = !isBgmEnabled;
  const btn = $('bgmToggleBtn');
  if (isBgmEnabled) {
    bgmAudio.play().catch(() => {});
    btn.textContent = '🎵 ON';
    btn.style.opacity = '1';
  } else {
    bgmAudio.pause();
    btn.textContent = '🔇 OFF';
    btn.style.opacity = '0.6';
  }
}

function addStar(n=1){ stars+=n; localStorage.setItem('ruriStars',stars); $('stars').textContent=stars; }

function playVoice(filename, fallbackText) {
  if (currentVoiceAudio) {
    currentVoiceAudio.pause();
    currentVoiceAudio.currentTime = 0;
    currentVoiceAudio = null;
  }
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
  }

  if(!filename) {
    if('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(fallbackText);
      u.lang = 'ja-JP'; u.rate = 1.15; u.pitch = 1.4;
      speechSynthesis.speak(u);
    }
    return;
  }

  const audio = new Audio(filename);
  currentVoiceAudio = audio;

  audio.play().catch(() => {
    if('speechSynthesis' in window) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(fallbackText);
      u.lang = 'ja-JP'; u.rate = 1.15; u.pitch = 1.4;
      speechSynthesis.speak(u);
    }
  });
}

function playWelcomeVoice() {
  if ($('home').classList.contains('active')) {
    playVoice('welcome.wav', 'るりちゃんのゲームランドへようこそ！いっしょにあそぼう！');
  }
}

function startWelcomeLoop() {
  stopWelcomeLoop();
  playWelcomeVoice();
  welcomeLoopTimer = setInterval(() => {
    if ($('home').classList.contains('active')) {
      playWelcomeVoice();
    } else {
      stopWelcomeLoop();
    }
  }, 10000);
}

function stopWelcomeLoop() {
  if(welcomeLoopTimer) {
    clearInterval(welcomeLoopTimer);
    welcomeLoopTimer = null;
  }
}

window.addEventListener('click', function initAudio() {
  startBGM();
  if ($('home').classList.contains('active') && !welcomeLoopTimer) {
    startWelcomeLoop();
  }
}, { once: true });

function playSound(type) {
  try {
    initAudioContext();
    if(!audioCtx) return;
    const c = audioCtx;
    if(type==='correct'){
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        const o=c.createOscillator(), g=c.createGain();
        o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(0.12, c.currentTime+i*0.07);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+i*0.07+0.3);
        o.connect(g).connect(c.destination); o.start(c.currentTime+i*0.07); o.stop(c.currentTime+i*0.07+0.3);
      });
    } else if(type==='wrong'){
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(300, c.currentTime);
      o.frequency.exponentialRampToValueAtTime(120, c.currentTime+0.25);
      g.gain.setValueAtTime(0.15, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.25);
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+0.25);
    } else if(type==='pop'){
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(900, c.currentTime);
      o.frequency.exponentialRampToValueAtTime(150, c.currentTime+0.09);
      g.gain.setValueAtTime(0.2, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.09);
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+0.09);
    } else if(type==='sparkle'){
      [1046.50, 1318.51, 1567.98].forEach((f, i) => {
        const o=c.createOscillator(), g=c.createGain();
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0.08, c.currentTime+i*0.05);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+i*0.05+0.2);
        o.connect(g).connect(c.destination); o.start(c.currentTime+i*0.05); o.stop(c.currentTime+i*0.05+0.2);
      });
    }
  }catch(e){}
}

function launchConfetti(){
  const container = $('confettiContainer');
  const colors = ['#ff5b5b', '#4aa8ff', '#ffd84a', '#5dcc78', '#a875e8'];
  for(let i=0; i<25; i++){
    const p = document.createElement('div'); p.className = 'confetti';
    p.style.left = Math.random()*100 + '%'; p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.4) + 's'; container.appendChild(p);
    setTimeout(() => p.remove(), 2600);
  }
}

function feedback(id,text){ const el=$(id);el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show'); }
function show(id){ 
  stopWelcomeLoop(); 
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  $(id).classList.add('active'); 
}
function goHome(){ 
  clearInterval(timer);timer=null;
  show('home');
  startWelcomeLoop();
}
function shuffle(a){ return a.sort(()=>Math.random()-.5) }

startWelcomeLoop();

/* 難易度選択処理 */
function selectDifficulty(gameType) {
  currentTargetGame = gameType;
  show('difficulty');
  playVoice('difficulty.wav', 'なんいどを えらんでね！');
}

function startGameWithDiff(diff) {
  currentDifficulty = diff;
  if(currentTargetGame === 'color') startColor();
  else if(currentTargetGame === 'animal') startAnimal();
  else if(currentTargetGame === 'number') startNumber();
  else if(currentTargetGame === 'shape') startShape();
}

function getChoiceCount() {
  return (currentDifficulty === 'easy') ? 4 : 6;
}

/* 色タッチ (10種類) */
const colors=[
  ['あか','#ff5b5b','🔴','aka.wav','赤'],
  ['あお','#4aa8ff','🔵','ao.wav','青'],
  ['きいろ','#ffd84a','🟡','kiiro.wav','黄色'],
  ['みどり','#5dcc78','🟢','midori.wav','緑'],
  ['むらさき','#a875e8','🟣','murasaki.wav','紫'],
  ['オレンジ','#ff9d4d','🟠','orange.wav','Orange'],
  ['ピンク','#ff9ebb','🩷','pink.wav','Pink'],
  ['しろ','#ffffff','⚪','shiro.wav','白'],
  ['くろ','#333333','🖤','kuro.wav','黒'],
  ['ちゃいろ','#a52a2a','🟤','chairo.wav','茶色']
];
let colorAnswer;
function startColor(){ show('color'); nextColor(); }
function nextColor(){
  const count = getChoiceCount();
  const selected=shuffle([...colors]).slice(0,count); colorAnswer=selected[Math.floor(Math.random()*count)];
  
  let labelText = colorAnswer[0];
  if (currentDifficulty === 'hard') {
    labelText = colorAnswer[4]; // むずかしい場合は漢字/英語表現
  }

  $('colorPrompt').textContent=`${labelText}を タッチしてね！ ${colorAnswer[2]}`;
  const choicesEl = $('colorChoices');
  choicesEl.innerHTML='';
  if(count === 6) choicesEl.classList.add('grid6'); else choicesEl.classList.remove('grid6');

  shuffle(selected).forEach(c=>{
    const b=document.createElement('button'); b.className='colorChoice'; b.style.background=c[1];

/* 🎨 おえかき機能 */
let canvas, ctx, drawing = false;
let drawColor = '#ff5b5b';

function startDraw() {
  show('draw');
  playVoice('oekaki.wav', 'じゆうに かいてね');
  setTimeout(initCanvas, 100);
}

function initCanvas() {
  const container = $('drawContainer');
  canvas = $('drawCanvas');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  ctx = canvas.getContext('2d');
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = drawColor;

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
  canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
  canvas.addEventListener('touchend', stopDrawing);
}

function startDrawing(e) {
  drawing = true;
  ctx.beginPath();
  const rect = canvas.getBoundingClientRect();
  ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
}

function draw(e) {
  if (!drawing) return;
  const rect = canvas.getBoundingClientRect();
  ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.stroke();
}

function stopDrawing() {
  if (drawing) {
    drawing = false;
    addStar();
  }
}

function handleTouchStart(e) {
  e.preventDefault();
  const touch = e.touches[0];
  startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
}

function handleTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  draw({ clientX: touch.clientX, clientY: touch.clientY });
}

function setDrawColor(color, el) {
  drawColor = color;
  if (ctx) ctx.strokeStyle = color;
  document.querySelectorAll('.colorDot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  playSound('pop');
}

function clearCanvas() {
  if (ctx && canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    playSound('sparkle');
    playVoice('kirei.wav', 'きれいになっちゃった');
  }
}
